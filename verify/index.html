<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Verify email · Veldra</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Verify your email address to advance your ReserveGrid OS access request to admin review.">
<link rel="icon" href="../favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../styles/shared.css" />

<style>
  html, body {
    margin: 0; background: var(--bg, #07101a); color: var(--fg, #f4f4f4);
    font-family: var(--sans, "Inter Tight", system-ui, sans-serif);
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body data-variant="layers">
<div id="root"></div>

<script src="../shared/i18n.js"></script>
<script src="../shared/auth.js"></script>
<script type="text/babel" src="../shared/components.jsx"></script>
<script type="text/babel" src="../shared/page-shell.jsx"></script>
<script type="text/babel" src="../shared/auth-shell.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

function syncDocTags() {
  if (typeof window.t !== "function") return;
  document.title = window.t("verify.page.title");
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute("content", window.t("verify.page.meta"));
}

const VerifyCard = () => {
  const [state, setState] = useState({ kind: "pending", message: "" });

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get("token");
    // Defensive: rg-auth tokens are 64-char hex. Copy-paste from a tracing
    // log can accidentally include trailing escaped newlines (\n\n) and
    // adjacent text. Strip everything after the leading hex run.
    const match = raw ? raw.match(/^[0-9a-fA-F]+/) : null;
    const token = match ? match[0] : "";
    if (!token) {
      setState({ kind: "error", message: t("verify.msg.no_token") });
      return;
    }
    // Rewrite the address bar to the canonical clean URL so the visible URL
    // matches the token actually submitted. history.replaceState avoids
    // adding a history entry, so back-button behavior is unchanged.
    if (raw && raw !== token) {
      try {
        window.history.replaceState(null, "", "/verify/?token=" + token);
      } catch (_) { /* ignore */ }
    }
    setState({ kind: "pending", message: t("verify.msg.pending") });
    window.VeldraAuth.verifyEmail(token).then((r) => {
      setState({ kind: r.ok ? "success" : "error", message: r.message });
    });
  }, []);

  return (
    <div className="auth-card">
      <h1>{t("verify.h1")}</h1>
      <div className={"auth-msg " + (state.kind === "success" ? "success" : state.kind === "error" ? "error" : "")}>
        {state.message}
      </div>
      {state.kind === "success" && (
        <p className="auth-lede" style={{ marginTop: 16 }}>{t("verify.success.body")}</p>
      )}
      <div className="auth-links">
        <a href="/login/">{t("auth.link.signin")}</a>
        <span className="sep">·</span>
        <a href="../legal/contact.html">{t("auth.link.contact_team")}</a>
      </div>
    </div>
  );
};

const App = () => {
  const [, setLangTick] = useState(0);
  useEffect(() => {
    syncDocTags();
    const onLang = () => { syncDocTags(); setLangTick(x => x + 1); };
    window.addEventListener("__lang_changed", onLang);
    return () => window.removeEventListener("__lang_changed", onLang);
  }, []);
  return (
    <>
      <AuthNav active="" />
      <main style={{ minHeight: "60vh", display: "flex", alignItems: "center" }}>
        <VerifyCard />
      </main>
      <AuthFooter />
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script src="../shared/scroll-effects.js" defer></script>
</body>
</html>
