<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Veldra · 404 · reason_code = path_not_found</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles/shared.css" />

<style>
  html, body {
    margin: 0;
    background: var(--bg, #07101a);
    color: var(--fg, #f4f4f4);
    font-family: var(--sans, "Inter Tight", system-ui, sans-serif);
    min-height: 100vh;
  }
  body { display: flex; flex-direction: column; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: stretch;
    min-height: calc(100vh - 73px);
  }

  /* Left — synthetic verdict log */
  .panel-l {
    padding: 80px 64px;
    background: var(--bg);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accent);
  }
  .big {
    font-family: var(--grotesk); font-size: 144px; font-weight: 500;
    letter-spacing: -0.05em; line-height: 0.85; margin: 24px 0 32px;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  .pitch {
    font-family: var(--grotesk); font-size: 36px; font-weight: 500;
    letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 24px;
    max-width: 520px; text-wrap: balance;
  }
  .sub {
    font-size: 16px; color: var(--fg-dim); line-height: 1.55;
    max-width: 460px; margin: 0;
  }

  .actions {
    display: flex; gap: 12px; flex-wrap: wrap; margin-top: 40px;
  }
  .a-btn {
    padding: 12px 22px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em;
    text-decoration: none;
    border: 1px solid var(--line);
    color: var(--fg);
    transition: all 120ms;
  }
  .a-btn:hover { border-color: var(--accent); color: var(--accent); }
  .a-btn.primary {
    background: var(--accent); border-color: var(--accent); color: #0b0b0b;
  }
  .a-btn.primary:hover { opacity: 0.85; color: #0b0b0b; }

  /* Right — verdict log */
  .panel-r {
    padding: 80px 64px;
    background: var(--bg-2);
    display: flex; flex-direction: column; justify-content: center;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
    color: var(--fg-dim);
  }
  .log-h {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--fg-dim); margin-bottom: 24px;
  }
  .log {
    border: 1px solid var(--line);
    padding: 20px 24px;
    background: var(--bg);
    max-width: 540px;
  }
  .log .row {
    padding: 4px 0;
    border-bottom: 1px dotted color-mix(in oklab, var(--line) 60%, transparent);
  }
  .log .row:last-child { border-bottom: none; }
  .log .k { color: var(--fg-dim); }
  .log .v { color: var(--fg); }
  .log .v.fail { color: #f87171; }
  .log .v.ok   { color: #34d399; }
  .log .v.code { color: var(--accent); }

  .nudge {
    margin-top: 28px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    color: var(--fg-dim); max-width: 540px; line-height: 1.7;
  }
  .nudge a { color: var(--accent); text-decoration: none; }
  .nudge a:hover { text-decoration: underline; }

  /* Tiny minimal footer */
  .mini-foot {
    padding: 24px 64px; border-top: 1px solid var(--line);
    background: var(--bg);
    display: flex; justify-content: space-between; gap: 24px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    color: var(--fg-dim); flex-wrap: wrap;
  }
  .mini-foot a { color: inherit; text-decoration: none; }
  .mini-foot a:hover { color: var(--fg); }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .panel-l, .panel-r { padding: 56px 28px; }
    .panel-l { border-right: none; border-bottom: 1px solid var(--line); }
    .big { font-size: 96px; }
    .pitch { font-size: 28px; }
    .mini-foot { padding: 24px 28px; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body data-variant="layers">
<div id="root"></div>

<script src="shared/i18n.js"></script>
<script type="text/babel" src="shared/components.jsx"></script>
<script type="text/babel" src="shared/page-shell.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const App = () => {
  const [now, setNow] = useState(() => new Date().toISOString());
  const [reqPath, setReqPath] = useState("/");
  useEffect(() => {
    setReqPath(window.location.pathname + window.location.search);
  }, []);
  return (
    <>
      <TopNav active={null} />
      <main>
        <div className="panel-l">
          <div>
            <div className="eyebrow">404 · reason_code = path_not_found</div>
            <div className="big">404</div>
            <h1 className="pitch">No template here. The verdict was reject.</h1>
            <p className="sub">
              The path you asked for didn't match anything the gateway knows about.
              The other surfaces — Architecture, Product, Failure Atlas, Q&amp;A, Docs —
              are still online and signed.
            </p>

            <div className="actions">
              <a className="a-btn primary" href="/">← Homepage</a>
              <a className="a-btn" href="Docs.html">Docs</a>
              <a className="a-btn" href="failure-atlas.html">Failure Atlas</a>
              <a className="a-btn" href="questions.html">Q&amp;A</a>
            </div>
          </div>

          <div className="eyebrow" style={{ marginTop: 64, color: "var(--fg-dim)", letterSpacing: "0.16em" }}>
            VELDRA · GATEWAY EDITION
          </div>
        </div>

        <div className="panel-r">
          <div className="log-h">SYNTHETIC VERDICT · {now}</div>
          <div className="log">
            <div className="row"><span className="k">event_id</span> · <span className="v">01J6P9-{Math.random().toString(36).slice(2, 8).toUpperCase()}-MISS</span></div>
            <div className="row"><span className="k">layer</span> · <span className="v">L0 transport</span></div>
            <div className="row"><span className="k">verdict</span> · <span className="v fail">REJECT</span></div>
            <div className="row"><span className="k">reason_code</span> · <span className="v code">path_not_found</span></div>
            <div className="row"><span className="k">requested</span> · <span className="v">{reqPath}</span></div>
            <div className="row"><span className="k">refused_at</span> · <span className="v">edge</span></div>
            <div className="row"><span className="k">forwarded</span> · <span className="v fail">false</span></div>
            <div className="row"><span className="k">durable_log</span> · <span className="v ok">true</span></div>
          </div>

          <div className="nudge">
            ↳ This is what every Veldra rejection looks like in the wild — a structured
            verdict, a stable reason code, a clear refusal posture. <a href="Docs.html#reason-codes">Browse the real ones →</a>
          </div>
        </div>
      </main>

      <div className="mini-foot">
        <span>© Veldra · gateway-edition</span>
        <span>1.1.0 · April 2026</span>
        <span style={{ display: "flex", gap: 14 }}>
          <a href="/">Home</a>
          <span>·</span>
          <a href="Docs.html">Docs</a>
          <span>·</span>
          <a href="legal/contact.html">Contact</a>
        </span>
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
