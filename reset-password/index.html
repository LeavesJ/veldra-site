<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Reset password · Veldra</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Choose a new password for your Veldra account using a one-time reset link.">
<link rel="icon" href="../favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../styles/shared.css" />

<style>
  html, body {
    margin: 0; background: var(--bg, #07101a); color: var(--fg, #f4f4f4);
    font-family: var(--sans, "Inter Tight", system-ui, sans-serif);
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body data-variant="layers">
<div id="root"></div>

<script src="../shared/i18n.js"></script>
<script src="../shared/auth.js"></script>
<script type="text/babel" src="../shared/components.jsx"></script>
<script type="text/babel" src="../shared/page-shell.jsx"></script>
<script type="text/babel" src="../shared/auth-shell.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

function syncDocTags() {
  if (typeof window.t !== "function") return;
  document.title = window.t("reset.page.title");
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute("content", window.t("reset.page.meta"));
}

const ResetCard = () => {
  const [token, setToken] = useState("");
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get("token");
    // Defensive: same hex-only sanitization as the verify page. Copy-paste
    // from a tracing log can include trailing escaped newlines and adjacent
    // text; strip everything after the leading hex run so the token always
    // hits rg-auth in canonical form.
    const match = raw ? raw.match(/^[0-9a-fA-F]+/) : null;
    const cleanToken = match ? match[0] : "";
    if (!cleanToken) {
      setMsg({ text: t("reset.msg.no_token"), kind: "error" });
    } else {
      setToken(cleanToken);
      // Rewrite the address bar to the canonical clean URL so the visible
      // URL matches the token actually held in state. replaceState avoids
      // adding a history entry, so back-button behavior is unchanged.
      if (raw !== cleanToken) {
        try {
          window.history.replaceState(null, "", "/reset-password/?token=" + cleanToken);
        } catch (_) { /* ignore */ }
      }
    }
  }, []);

  const onSubmit = (e) => {
    e.preventDefault();
    if (!token) {
      setMsg({ text: t("reset.msg.no_token_short"), kind: "error" });
      return;
    }
    if (!password || password.length < 8) {
      setMsg({ text: t("reset.msg.pw_short"), kind: "error" });
      return;
    }
    if (password !== confirm) {
      setMsg({ text: t("reset.msg.pw_mismatch"), kind: "error" });
      return;
    }
    setBusy(true);
    setMsg({ text: t("reset.msg.resetting"), kind: "" });
    window.VeldraAuth.resetPassword(token, password).then((r) => {
      if (r.ok) {
        setDone(true);
      } else {
        setMsg({ text: r.message || t("reset.msg.failed"), kind: "error" });
        setBusy(false);
      }
    }).catch(() => {
      setMsg({ text: t("auth.msg.network_error"), kind: "error" });
      setBusy(false);
    });
  };

  if (done) {
    return (
      <div className="auth-card">
        <h1>{t("reset.done.h1")}</h1>
        <p className="auth-lede">{t("reset.done.body")}</p>
        <a className="auth-btn" href="/login/" style={{ display: "block", textAlign: "center", textDecoration: "none" }}>
          {t("reset.done.btn")}
        </a>
      </div>
    );
  }

  return (
    <div className="auth-card">
      <h1>{t("reset.h1")}</h1>
      <p className="auth-lede">{t("reset.lede")}</p>

      {msg && <div className={"auth-msg " + msg.kind}>{msg.text}</div>}

      <form onSubmit={onSubmit}>
        <div className="auth-field">
          <label htmlFor="password">{t("auth.field.password_new")}</label>
          <input id="password" type="password" autoComplete="new-password" required minLength="8"
                 value={password} onChange={(e) => setPassword(e.target.value)} />
        </div>
        <div className="auth-field">
          <label htmlFor="confirm">{t("auth.field.password_confirm_new")}</label>
          <input id="confirm" type="password" autoComplete="new-password" required
                 value={confirm} onChange={(e) => setConfirm(e.target.value)} />
        </div>
        <button className="auth-btn" type="submit" disabled={busy || !token}>
          {busy ? t("reset.btn.busy") : t("reset.btn")}
        </button>
      </form>

      <div className="auth-links">
        <a href="/login/">{t("auth.link.back_to_signin")}</a>
        <span className="sep">·</span>
        <a href="/forgot-password/">{t("reset.link.request_new")}</a>
      </div>
    </div>
  );
};

const App = () => {
  const [, setLangTick] = useState(0);
  useEffect(() => {
    syncDocTags();
    const onLang = () => { syncDocTags(); setLangTick(x => x + 1); };
    window.addEventListener("__lang_changed", onLang);
    return () => window.removeEventListener("__lang_changed", onLang);
  }, []);
  return (
    <>
      <AuthNav active="" />
      <main style={{ minHeight: "60vh", display: "flex", alignItems: "center" }}>
        <ResetCard />
      </main>
      <AuthFooter />
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script src="../shared/scroll-effects.js" defer></script>
</body>
</html>
