<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Account · Veldra</title>
<link rel="canonical" href="https://veldra.org/account" />
<meta name="robots" content="noindex" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Manage your Veldra account, license tier, and ReserveGrid OS API keys.">
<link rel="icon" href="../favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../styles/shared.css" />

<style>
  html, body {
    margin: 0; background: var(--bg, #07101a); color: var(--fg, #f4f4f4);
    font-family: var(--sans, "Inter Tight", system-ui, sans-serif);
  }

  /* Account-page-specific cards. Wider than the centered auth-card pattern. */
  .acct-shell {
    max-width: 1100px;
    margin: 64px auto;
    padding: 0 48px;
  }
  .acct-card {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    padding: 28px 32px;
    margin-bottom: 24px;
  }
  .acct-card h2 {
    font-family: var(--grotesk);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.015em;
    margin: 0 0 8px;
  }
  .acct-card .acct-sub {
    font-size: 13px;
    color: var(--fg-dim);
    margin: 0 0 20px;
    line-height: 1.55;
  }
  .acct-kv {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
    padding: 18px 0 4px;
    border-top: 1px solid var(--line);
  }
  .acct-kv .k {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--fg-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .acct-kv .v {
    font-family: var(--grotesk);
    font-size: 18px;
    font-weight: 500;
  }

  .key-row {
    display: grid;
    grid-template-columns: 1fr 100px 120px 90px;
    gap: 12px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .key-row:last-child { border-bottom: none; }
  .key-row .km {
    font-family: var(--mono);
    color: var(--fg-dim);
  }
  .key-row .badge {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid var(--line);
  }
  .key-row .badge.active  { color: #7ed4a8; border-color: color-mix(in oklab, #7ed4a8 40%, transparent); }
  .key-row .badge.revoked { color: #e58181; border-color: color-mix(in oklab, #e58181 35%, transparent); }
  .key-row button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg-dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 2px;
    transition: border-color 0.15s, color 0.15s;
  }
  .key-row button:hover { border-color: #e58181; color: #e58181; }
  .key-row button[disabled] { opacity: 0.4; cursor: not-allowed; }

  .key-generated {
    margin-top: 18px;
    padding: 16px 18px;
    border: 1px solid var(--accent);
    background: color-mix(in oklab, var(--bg) 70%, transparent);
    font-family: var(--mono);
    font-size: 13px;
    word-break: break-all;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body data-variant="layers">
<div id="root"></div>

<script src="../shared/i18n.js"></script>
<script src="../shared/auth.js"></script>
<script type="text/babel" src="../shared/components.jsx"></script>
<script type="text/babel" src="../shared/page-shell.jsx"></script>
<script type="text/babel" src="../shared/auth-shell.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

function syncDocTags() {
  if (typeof window.t !== "function") return;
  document.title = window.t("account.page.title");
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute("content", window.t("account.page.meta"));
}

const KeysPanel = () => {
  const [keys, setKeys] = useState([]);
  const [loadErr, setLoadErr] = useState(null);
  const [label, setLabel] = useState("");
  const [generated, setGenerated] = useState(null);
  const [genErr, setGenErr] = useState(null);
  const [busy, setBusy] = useState(false);

  const refresh = () => {
    window.VeldraAuth.listKeys().then((r) => {
      if (r.ok) {
        setKeys(r.keys);
        setLoadErr(null);
      } else {
        setLoadErr(r.error || t("account.keys.load_failed"));
      }
    });
  };

  useEffect(() => { refresh(); }, []);

  const onGenerate = () => {
    setGenErr(null);
    setBusy(true);
    window.VeldraAuth.generateKey(label).then((r) => {
      if (r.ok) {
        setGenerated(r.key);
        setLabel("");
        refresh();
      } else {
        setGenErr(r.error || t("account.keys.generate_failed"));
      }
      setBusy(false);
    });
  };

  const onRevoke = (keyId) => {
    if (!window.confirm(t("account.keys.revoke_confirm"))) return;
    window.VeldraAuth.revokeKey(keyId).then((r) => {
      if (r.ok) {
        refresh();
      } else {
        window.alert(r.error || t("account.keys.revoke_failed"));
      }
    });
  };

  return (
    <div className="acct-card">
      <h2>{t("account.keys.h2")}</h2>
      <p className="acct-sub">{t("account.keys.lede")}</p>

      {loadErr && <div className="auth-msg error">{loadErr}</div>}

      <div style={{ display: "flex", gap: 12, margin: "8px 0 18px", alignItems: "stretch" }}>
        <input type="text" placeholder={t("account.keys.label_placeholder")}
               value={label}
               onChange={(e) => setLabel(e.target.value)}
               style={{
                 flex: 1, padding: "10px 12px",
                 background: "var(--bg)", border: "1px solid var(--line)",
                 color: "var(--fg)", fontFamily: "var(--sans)", fontSize: 13,
               }} />
        <button onClick={onGenerate} disabled={busy} className="auth-btn"
                style={{ width: "auto", padding: "10px 18px", fontSize: 13 }}>
          {busy ? t("account.keys.generating") : t("account.keys.generate")}
        </button>
      </div>

      {genErr && <div className="auth-msg error">{genErr}</div>}

      {generated && (
        <div>
          <div className="auth-msg success" style={{ marginBottom: 8 }}>
            {t("account.keys.generated_warning")}
          </div>
          <div className="key-generated">{generated.key_value}</div>
        </div>
      )}

      <div style={{ marginTop: 18 }}>
        {keys.length === 0 && !loadErr && (
          <div className="acct-sub" style={{ padding: "12px 0", margin: 0 }}>
            {t("account.keys.empty")}
          </div>
        )}
        {keys.map((k) => (
          <div key={k.id} className="key-row">
            <div>
              <span className="km">{k.key_prefix}...</span>
              {k.label && <span style={{ color: "var(--fg-dim)", marginLeft: 12, fontSize: 12 }}>· {k.label}</span>}
            </div>
            <span className={"badge " + (k.status === "active" ? "active" : "revoked")}>{k.status}</span>
            <span className="km" style={{ fontSize: 11 }}>{k.created_at ? k.created_at.split("T")[0] : ""}</span>
            <div>
              {k.status === "active"
                ? <button onClick={() => onRevoke(k.id)}>{t("account.keys.revoke_btn")}</button>
                : <button disabled>{t("account.keys.revoked_btn")}</button>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

const App = () => {
  const [state, setState] = useState({ kind: "loading" });
  const [, setLangTick] = useState(0);

  useEffect(() => {
    syncDocTags();
    const onLang = () => { syncDocTags(); setLangTick(x => x + 1); };
    window.addEventListener("__lang_changed", onLang);
    return () => window.removeEventListener("__lang_changed", onLang);
  }, []);

  useEffect(() => {
    if (!window.VeldraAuth.getToken()) {
      window.location.href = "/login/";
      return;
    }
    window.VeldraAuth.sessionCheck().then((r) => {
      if (r.ok) {
        setState({ kind: "ok", user: r.user });
      } else {
        window.location.href = "/login/";
      }
    });
  }, []);

  const onSignOut = () => {
    window.VeldraAuth.logout().then(() => {
      window.location.href = "/login/";
    });
  };

  if (state.kind !== "ok") {
    return (
      <>
        <AuthNav active="" />
        <main style={{ minHeight: "60vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div className="acct-sub">{t("account.loading")}</div>
        </main>
        <AuthFooter />
      </>
    );
  }

  const u = state.user || {};
  return (
    <>
      <AuthNav active="" />
      <main>
        <div className="acct-shell">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24, flexWrap: "wrap", gap: 16 }}>
            <div>
              <div className="eyebrow">{t("account.eyebrow")}</div>
              <h1 style={{
                fontFamily: "var(--grotesk)", fontSize: 48, fontWeight: 500,
                letterSpacing: "-0.025em", margin: "12px 0 0",
              }}>
                {u.name || t("account.default_name")}
              </h1>
            </div>
            <button onClick={onSignOut} className="btn btn-ghost" style={{ fontSize: 12, padding: "10px 18px" }}>
              {t("auth.signout")}
            </button>
          </div>

          <div className="acct-card">
            <h2>{t("account.profile.h2")}</h2>
            <p className="acct-sub">{t("account.profile.lede")}</p>
            <div className="acct-kv">
              <div>
                <div className="k">{t("account.profile.name")}</div>
                <div className="v">{u.name || "—"}</div>
              </div>
              <div>
                <div className="k">{t("account.profile.email")}</div>
                <div className="v" style={{ fontSize: 14, fontFamily: "var(--mono)" }}>{u.email || "—"}</div>
              </div>
              <div>
                <div className="k">{t("account.profile.org")}</div>
                <div className="v">{u.org || "—"}</div>
              </div>
              <div>
                <div className="k">{t("account.profile.tier")}</div>
                <div className="v" style={{ color: "var(--accent)" }}>{u.tier || "shadow"}</div>
              </div>
            </div>
          </div>

          <KeysPanel />

          <div className="acct-card" style={{ borderLeftColor: "var(--fg-dim)" }}>
            <h2>{t("account.tier.h2")}</h2>
            <p className="acct-sub">{t("account.tier.lede")}</p>
            <a href="../legal/contact.html" className="auth-btn" style={{
              display: "inline-block", width: "auto", padding: "10px 18px", fontSize: 13,
              textDecoration: "none",
            }}>
              {t("account.tier.cta")}
            </a>
          </div>
        </div>
      </main>
      <AuthFooter />
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script src="../shared/scroll-effects.js" defer></script>
</body>
</html>
