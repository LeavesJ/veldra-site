<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Request access · Veldra</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Request access to ReserveGrid OS. Submissions are reviewed manually; approved operators receive a verification email and login credentials.">
<link rel="icon" href="../favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../styles/shared.css" />

<style>
  html, body {
    margin: 0; background: var(--bg, #07101a); color: var(--fg, #f4f4f4);
    font-family: var(--sans, "Inter Tight", system-ui, sans-serif);
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body data-variant="layers">
<div id="root"></div>

<script src="../shared/i18n.js"></script>
<script src="../shared/auth.js"></script>
<script type="text/babel" src="../shared/components.jsx"></script>
<script type="text/babel" src="../shared/page-shell.jsx"></script>
<script type="text/babel" src="../shared/auth-shell.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

function syncDocTags() {
  if (typeof window.t !== "function") return;
  document.title = window.t("register.page.title");
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute("content", window.t("register.page.meta"));
}

const RegisterCard = () => {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [org, setOrg] = useState("");
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);

  const onSubmit = (e) => {
    e.preventDefault();
    if (!name || !email || !org || !password) {
      setMsg({ text: t("register.msg.required"), kind: "error" });
      return;
    }
    if (password.length < 8) {
      setMsg({ text: t("register.msg.pw_short"), kind: "error" });
      return;
    }
    if (password !== confirm) {
      setMsg({ text: t("register.msg.pw_mismatch"), kind: "error" });
      return;
    }
    setBusy(true);
    setMsg({ text: t("register.msg.submitting"), kind: "" });
    window.VeldraAuth.register(email, name, org, password).then((result) => {
      if (result.ok) {
        setDone(true);
      } else {
        setMsg({ text: result.error || t("register.msg.failed"), kind: "error" });
        setBusy(false);
      }
    }).catch(() => {
      setMsg({ text: t("auth.msg.network_error"), kind: "error" });
      setBusy(false);
    });
  };

  if (done) {
    return (
      <div className="auth-card">
        <h1>{t("register.done.h1")}</h1>
        <p className="auth-lede"
           dangerouslySetInnerHTML={{ __html: window.tWith("register.done.body.html", { email: email }) }} />
        <div className="auth-links">
          <a href="/login/">{t("auth.link.back_to_signin")}</a>
        </div>
      </div>
    );
  }

  return (
    <div className="auth-card">
      <h1>{t("register.h1")}</h1>
      <p className="auth-lede">{t("register.lede")}</p>

      {msg && <div className={"auth-msg " + msg.kind}>{msg.text}</div>}

      <form onSubmit={onSubmit}>
        <div className="auth-field">
          <label htmlFor="name">{t("auth.field.name")}</label>
          <input id="name" type="text" autoComplete="name" required
                 value={name} onChange={(e) => setName(e.target.value)} />
        </div>
        <div className="auth-field">
          <label htmlFor="email">{t("auth.field.email")}</label>
          <input id="email" type="email" autoComplete="email" required
                 value={email} onChange={(e) => setEmail(e.target.value)} />
        </div>
        <div className="auth-field">
          <label htmlFor="org">{t("auth.field.org")}</label>
          <input id="org" type="text" autoComplete="organization" required
                 placeholder={t("auth.field.org_placeholder")}
                 value={org} onChange={(e) => setOrg(e.target.value)} />
        </div>
        <div className="auth-field">
          <label htmlFor="password">{t("auth.field.password")}</label>
          <input id="password" type="password" autoComplete="new-password" required
                 minLength="8"
                 value={password} onChange={(e) => setPassword(e.target.value)} />
        </div>
        <div className="auth-field">
          <label htmlFor="confirm">{t("auth.field.password_confirm")}</label>
          <input id="confirm" type="password" autoComplete="new-password" required
                 value={confirm} onChange={(e) => setConfirm(e.target.value)} />
        </div>
        <button className="auth-btn" type="submit" disabled={busy}>
          {busy ? t("register.btn.busy") : t("register.btn")}
        </button>
      </form>

      <div className="auth-links">
        <a href="/login/">{t("register.link.have_access")}</a>
      </div>
    </div>
  );
};

const App = () => {
  const [, setLangTick] = useState(0);
  useEffect(() => {
    syncDocTags();
    const onLang = () => { syncDocTags(); setLangTick(x => x + 1); };
    window.addEventListener("__lang_changed", onLang);
    return () => window.removeEventListener("__lang_changed", onLang);
  }, []);
  return (
    <>
      <AuthNav active="" />
      <main style={{ padding: "32px 0", display: "flex", alignItems: "flex-start" }}>
        <RegisterCard />
      </main>
      <AuthFooter />
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script src="../shared/scroll-effects.js" defer></script>
</body>
</html>
